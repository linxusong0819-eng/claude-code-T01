<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f5dff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="见人计划">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>年度见人计划 · People Planner</title>
<style>
  :root {
    --bg: #fafaf7;
    --card: #ffffff;
    --ink: #1f2330;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2f5dff;
    --accent-soft: #eaf0ff;
    --done: #10b981;
    --done-soft: #e7f7f0;
    --plan: #f59e0b;
    --plan-soft: #fff5e1;
    --danger: #ef4444;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 980px; margin: 0 auto;
    padding:
      calc(28px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(80px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
  }
  header.top {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
  }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    padding: 8px 14px; border-radius: 8px; transition: .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  button.primary:hover { background: #1f47d6; color: #fff; }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); border-color: #f3c6c6; }
  button.danger:hover { background: #fff0f0; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin: 16px 0 20px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow);
  }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .num { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .stat.met .num { color: var(--done); }
  .stat.plan .num { color: var(--plan); }
  .stat.month .num { color: var(--accent); }

  .filters {
    display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
    align-items: center;
  }
  .chip {
    border: 1px solid var(--line); background: var(--card);
    padding: 6px 12px; border-radius: 999px; font-size: 13px;
    cursor: pointer; color: var(--muted);
  }
  .chip.on { background: var(--accent-soft); color: var(--accent);
             border-color: #cfdcff; }
  .search {
    margin-left: auto; flex: 1 1 220px; max-width: 320px;
  }
  .search input {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font: inherit; background: var(--card);
  }
  .search input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  /* Form */
  .form-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; box-shadow: var(--shadow);
    margin-bottom: 18px; display: none;
  }
  .form-card.open { display: block; }
  .form-grid {
    display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 10px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid label {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: var(--muted);
  }
  .form-grid input, .form-grid select, .form-grid textarea {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font: inherit; background: #fff; color: var(--ink);
  }
  .form-grid textarea { min-height: 64px; resize: vertical; }
  .form-actions {
    display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;
  }

  /* Timeline */
  .month {
    margin-bottom: 22px;
  }
  .month-head {
    display: flex; align-items: baseline; gap: 10px;
    border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px;
  }
  .month-head .name { font-weight: 600; font-size: 16px; }
  .month-head .count { color: var(--muted); font-size: 12px; }

  .row {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    display: grid; grid-template-columns: 90px 1fr auto;
    gap: 12px; align-items: center; box-shadow: var(--shadow);
  }
  .row .date {
    font-variant-numeric: tabular-nums; color: var(--muted);
    font-size: 13px; white-space: nowrap;
  }
  .row .date .d { color: var(--ink); font-size: 18px; font-weight: 600; display: block; }
  .row .body { min-width: 0; }
  .row .name { font-weight: 600; font-size: 15px; }
  .row .meta { color: var(--muted); font-size: 12px; margin-top: 2px;
               display: flex; gap: 10px; flex-wrap: wrap; }
  .row .notes { color: #444; font-size: 13px; margin-top: 4px;
                white-space: pre-wrap; word-break: break-word; }
  .row .right { display: flex; gap: 6px; align-items: center; }
  .row .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
  }
  .badge.met { background: var(--done-soft); color: var(--done); }
  .badge.plan { background: var(--plan-soft); color: var(--plan); }
  .iconbtn {
    border: none; background: transparent; padding: 4px 6px;
    color: var(--muted); border-radius: 6px;
  }
  .iconbtn:hover { color: var(--accent); background: var(--accent-soft); }
  .iconbtn.del:hover { color: var(--danger); background: #fff0f0; }

  .empty {
    text-align: center; color: var(--muted); padding: 60px 0;
    border: 1px dashed var(--line); border-radius: 12px; background: #fff;
  }
  .empty h3 { margin: 0 0 6px; color: var(--ink); }

  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 30px; }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .row { grid-template-columns: 70px 1fr; }
    .row .right { grid-column: 1 / -1; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>年度见人计划</h1>
      <div class="sub" id="subtitle">规划今年要见的人，记录见过的人</div>
    </div>
    <div class="toolbar">
      <button class="primary" id="btn-add">+ 新增</button>
      <button class="ghost" id="btn-export">导出</button>
      <button class="ghost" id="btn-import">导入</button>
      <input type="file" id="file-import" accept="application/json" hidden>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="label">今年总人数</div><div class="num" id="s-total">0</div></div>
    <div class="stat met"><div class="label">已见</div><div class="num" id="s-met">0</div></div>
    <div class="stat plan"><div class="label">待见</div><div class="num" id="s-plan">0</div></div>
    <div class="stat month"><div class="label">本月</div><div class="num" id="s-month">0</div></div>
  </div>

  <div class="form-card" id="form-card">
    <div class="form-grid">
      <label class="full">姓名 *
        <input id="f-name" type="text" placeholder="例如：张三" maxlength="60">
      </label>
      <label>日期 *
        <input id="f-date" type="date">
      </label>
      <label>时间
        <input id="f-time" type="time">
      </label>
      <label>地点
        <input id="f-location" type="text" placeholder="例如：北京 / 线上" maxlength="60">
      </label>
      <label>状态
        <select id="f-status">
          <option value="auto">自动（按日期）</option>
          <option value="met">已见</option>
          <option value="plan">待见</option>
        </select>
      </label>
      <label class="full">主题 / 目的
        <input id="f-topic" type="text" placeholder="例如：合作讨论、聚会、项目复盘" maxlength="120">
      </label>
      <label class="full">备注
        <textarea id="f-notes" placeholder="任何想记的：联系方式、要点、后续动作……"></textarea>
      </label>
    </div>
    <div class="form-actions">
      <button class="ghost" id="btn-cancel">取消</button>
      <button class="primary" id="btn-save">保存</button>
    </div>
  </div>

  <div class="filters">
    <div class="chip on" data-filter="all">全部</div>
    <div class="chip" data-filter="plan">待见</div>
    <div class="chip" data-filter="met">已见</div>
    <div class="chip" data-filter="thismonth">本月</div>
    <div class="search"><input id="q" type="text" placeholder="搜索姓名 / 主题 / 备注 / 地点"></div>
  </div>

  <div id="list"></div>

  <footer>数据保存在你的浏览器本地（localStorage），不会上传。建议定期导出备份。</footer>
</div>

<script>
(function () {
  const STORE_KEY = "people-planner.v1";
  const TODAY = new Date(); TODAY.setHours(0,0,0,0);
  const YEAR = TODAY.getFullYear();

  document.getElementById("subtitle").textContent =
    `规划 ${YEAR} 年要见的人，记录见过的人`;

  /** @type {{id:string,name:string,date:string,time?:string,location?:string,topic?:string,notes?:string,status:"met"|"plan"|"auto"}[]} */
  let data = load();
  let editingId = null;
  let filter = "all";
  let query = "";

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  function effectiveStatus(item) {
    if (item.status === "met" || item.status === "plan") return item.status;
    const d = new Date(item.date + "T00:00:00");
    return d <= TODAY ? "met" : "plan";
  }

  function escapeHtml(s) {
    return (s ?? "").replace(/[&<>"']/g, c => (
      { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]
    ));
  }

  function fmtDate(s) {
    const d = new Date(s + "T00:00:00");
    return { day: d.getDate(), wd: "日一二三四五六"[d.getDay()] };
  }

  function monthKey(s) {
    const d = new Date(s + "T00:00:00");
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  function monthLabel(key) {
    const [y, m] = key.split("-");
    return `${y} 年 ${parseInt(m,10)} 月`;
  }

  function applyFilter(items) {
    const q = query.trim().toLowerCase();
    return items.filter(it => {
      if (q) {
        const hay = [it.name, it.topic, it.notes, it.location].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (filter === "all") return true;
      if (filter === "thismonth") {
        return monthKey(it.date) === `${YEAR}-${String(TODAY.getMonth()+1).padStart(2,"0")}`;
      }
      return effectiveStatus(it) === filter;
    });
  }

  function render() {
    const total = data.length;
    let met = 0, plan = 0, thisMonth = 0;
    const tmKey = `${YEAR}-${String(TODAY.getMonth()+1).padStart(2,"0")}`;
    for (const it of data) {
      const st = effectiveStatus(it);
      if (st === "met") met++; else plan++;
      if (monthKey(it.date) === tmKey) thisMonth++;
    }
    document.getElementById("s-total").textContent = total;
    document.getElementById("s-met").textContent = met;
    document.getElementById("s-plan").textContent = plan;
    document.getElementById("s-month").textContent = thisMonth;

    const list = document.getElementById("list");
    const filtered = applyFilter([...data]).sort((a,b) => {
      if (a.date !== b.date) return a.date.localeCompare(b.date);
      return (a.time || "").localeCompare(b.time || "");
    });

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <h3>${data.length === 0 ? "还没有任何记录" : "没有匹配的结果"}</h3>
          <div>${data.length === 0 ? "点击右上角「+ 新增」添加你想见的人。" : "试试调整筛选条件或搜索词。"}</div>
        </div>`;
      return;
    }

    const groups = new Map();
    for (const it of filtered) {
      const k = monthKey(it.date);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(it);
    }

    let html = "";
    for (const [k, items] of groups) {
      const metInGroup = items.filter(i => effectiveStatus(i) === "met").length;
      html += `<section class="month">
        <div class="month-head">
          <div class="name">${monthLabel(k)}</div>
          <div class="count">共 ${items.length} 人 · 已见 ${metInGroup}</div>
        </div>`;
      for (const it of items) {
        const st = effectiveStatus(it);
        const f = fmtDate(it.date);
        html += `<div class="row" data-id="${it.id}">
          <div class="date">
            <span class="d">${f.day}</span>
            周${f.wd}${it.time ? " · " + escapeHtml(it.time) : ""}
          </div>
          <div class="body">
            <div class="name">${escapeHtml(it.name)}
              <span class="badge ${st}">${st === "met" ? "已见" : "待见"}</span>
            </div>
            <div class="meta">
              ${it.topic ? `<span>📌 ${escapeHtml(it.topic)}</span>` : ""}
              ${it.location ? `<span>📍 ${escapeHtml(it.location)}</span>` : ""}
            </div>
            ${it.notes ? `<div class="notes">${escapeHtml(it.notes)}</div>` : ""}
          </div>
          <div class="right">
            ${st === "plan"
              ? `<button class="iconbtn" data-act="markmet" title="标记为已见">✓</button>`
              : `<button class="iconbtn" data-act="markplan" title="改回待见">↺</button>`}
            <button class="iconbtn" data-act="edit" title="编辑">✎</button>
            <button class="iconbtn del" data-act="del" title="删除">✕</button>
          </div>
        </div>`;
      }
      html += `</section>`;
    }
    list.innerHTML = html;
  }

  // Form
  const form = document.getElementById("form-card");
  function openForm(item) {
    editingId = item ? item.id : null;
    document.getElementById("f-name").value = item?.name || "";
    document.getElementById("f-date").value = item?.date ||
      `${YEAR}-${String(TODAY.getMonth()+1).padStart(2,"0")}-${String(TODAY.getDate()).padStart(2,"0")}`;
    document.getElementById("f-time").value = item?.time || "";
    document.getElementById("f-location").value = item?.location || "";
    document.getElementById("f-topic").value = item?.topic || "";
    document.getElementById("f-notes").value = item?.notes || "";
    document.getElementById("f-status").value = item?.status || "auto";
    form.classList.add("open");
    document.getElementById("f-name").focus();
  }
  function closeForm() { form.classList.remove("open"); editingId = null; }

  document.getElementById("btn-add").addEventListener("click", () => openForm(null));
  document.getElementById("btn-cancel").addEventListener("click", closeForm);

  document.getElementById("btn-save").addEventListener("click", () => {
    const name = document.getElementById("f-name").value.trim();
    const date = document.getElementById("f-date").value;
    if (!name) { alert("请填写姓名"); return; }
    if (!date) { alert("请选择日期"); return; }
    const payload = {
      name,
      date,
      time: document.getElementById("f-time").value || "",
      location: document.getElementById("f-location").value.trim(),
      topic: document.getElementById("f-topic").value.trim(),
      notes: document.getElementById("f-notes").value.trim(),
      status: document.getElementById("f-status").value
    };
    if (editingId) {
      const i = data.findIndex(x => x.id === editingId);
      if (i >= 0) data[i] = { ...data[i], ...payload };
    } else {
      data.push({ id: uid(), ...payload });
    }
    save(); closeForm(); render();
  });

  // List actions
  document.getElementById("list").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const row = e.target.closest(".row");
    const id = row?.dataset.id;
    const idx = data.findIndex(x => x.id === id);
    if (idx < 0) return;
    const act = btn.dataset.act;
    if (act === "del") {
      if (confirm(`删除「${data[idx].name}」？`)) { data.splice(idx, 1); save(); render(); }
    } else if (act === "edit") {
      openForm(data[idx]);
    } else if (act === "markmet") {
      data[idx].status = "met"; save(); render();
    } else if (act === "markplan") {
      data[idx].status = "plan"; save(); render();
    }
  });

  // Filters
  document.querySelectorAll(".chip").forEach(c => {
    c.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
      c.classList.add("on");
      filter = c.dataset.filter;
      render();
    });
  });
  document.getElementById("q").addEventListener("input", (e) => {
    query = e.target.value; render();
  });

  // Export / Import
  document.getElementById("btn-export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `people-planner-${YEAR}-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById("btn-import").addEventListener("click", () => {
    document.getElementById("file-import").click();
  });
  document.getElementById("file-import").addEventListener("change", (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const arr = JSON.parse(r.result);
        if (!Array.isArray(arr)) throw new Error("格式错误");
        const mode = confirm("导入：确定 = 合并到当前数据，取消 = 完全替换") ? "merge" : "replace";
        if (mode === "replace") data = [];
        const have = new Set(data.map(x => x.id));
        for (const it of arr) {
          if (!it || !it.name || !it.date) continue;
          const item = {
            id: it.id && !have.has(it.id) ? it.id : uid(),
            name: String(it.name),
            date: String(it.date),
            time: it.time || "",
            location: it.location || "",
            topic: it.topic || "",
            notes: it.notes || "",
            status: ["met","plan","auto"].includes(it.status) ? it.status : "auto"
          };
          have.add(item.id);
          data.push(item);
        }
        save(); render();
        alert(`导入完成，共 ${arr.length} 条`);
      } catch (err) {
        alert("导入失败：" + err.message);
      } finally {
        e.target.value = "";
      }
    };
    r.readAsText(file);
  });

  render();
})();
</script>
</body>
</html>
